<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Under Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #0b0f2b;
    --sky2: #2a1446;
    --card: #1a1235cc;
    --text: #fbe9f0;
    --gold: #f5c66b;
    --yes: #e8336f;
    --yes-hover: #ff4a85;
    --no: #3a2f57;
    --no-text: #cbb9dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 120%, #4a1d4f 0%, transparent 60%),
                linear-gradient(180deg, var(--sky1), var(--sky2));
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* night sky */
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .15; } }
  .moon {
    position: fixed; top: 6vh; right: 8vw;
    width: 70px; height: 70px; border-radius: 50%;
    background: #fff4d6;
    box-shadow: 0 0 40px 10px #fff4d655;
  }
  .moon::after {
    content: ''; position: absolute; top: -6px; left: -14px;
    width: 70px; height: 70px; border-radius: 50%;
    background: var(--sky1);
  }

  .card {
    position: relative; z-index: 2;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid #f5c66b44;
    border-radius: 28px;
    padding: 34px 24px 38px;
    width: 100%; max-width: 440px;
    text-align: center;
    box-shadow: 0 0 60px #e8336f33;
  }
  .emoji {
    font-size: 84px; line-height: 1;
    display: inline-block;
    animation: glow 2.4s ease-in-out infinite;
    user-select: none;
  }
  @keyframes glow { 50% { transform: translateY(-8px); filter: drop-shadow(0 0 14px #f5c66b); } }
  h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400; color: var(--gold);
    font-size: clamp(34px, 9vw, 46px); line-height: 1.15;
    margin: 16px 0 8px;
  }
  .sub {
    min-height: 1.6em;
    font-size: 17px; font-weight: 700;
    margin-bottom: 26px;
  }
  .sub.pop { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.12); } }

  .sad #question { display: none; }
  .sad .sub {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    color: var(--gold);
    font-size: clamp(32px, 8.5vw, 42px); line-height: 1.2;
    margin: 18px 0 28px;
  }
  .sad .emoji { animation: shake .5s ease; font-size: 100px; }
  @keyframes shake {
    20%, 60% { transform: translateX(-10px) rotate(-6deg); }
    40%, 80% { transform: translateX(10px) rotate(6deg); }
  }

  .buttons {
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: center;
    min-height: 70px;
  }
  button {
    font-family: inherit; font-weight: 700;
    border: none; border-radius: 999px; cursor: pointer;
    transition: transform .25s ease, font-size .25s ease, padding .25s ease, opacity .3s;
  }
  #yes {
    background: var(--yes); color: #fff;
    font-size: 20px; padding: 12px 34px;
    box-shadow: 0 0 24px #e8336f88;
  }
  #yes:hover { background: var(--yes-hover); }
  #no { background: var(--no); color: var(--no-text); font-size: 20px; padding: 12px 34px; }
  #no.gone { opacity: 0; pointer-events: none; position: absolute; }

  /* success */
  .success { display: none; }
  .done .ask { display: none; }
  .done .success { display: block; }
  .couple { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
  .couple .float-heart { animation: rise 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  @keyframes rise { 0% { transform: translateY(8px) scale(.8); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-18px) scale(1.1); opacity: 0; } }
  .success h1 { margin-top: 6px; }
  .success p { font-size: 17px; line-height: 1.5; }

  .fall {
    position: fixed; top: -40px; z-index: 1;
    pointer-events: none; user-select: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
  <div class="moon"></div>

  <div class="card" id="card">
    <div class="ask">
      <div class="emoji" id="emoji">🕯️🍷</div>
      <h1 id="question">Khushi, will you go on a romantic dinner date with me?</h1>
      <div class="sub" id="sub">Just you, me, candles &amp; the moon 🌙</div>
      <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
      </div>
    </div>

    <div class="success">

            <stop offset="1" stop-color="#a50c3a"/>
          </linearGradient>
          <linearGradient id="suit" x1="0" x2="1">
            <stop offset="0" stop-color="#1b2246"/>
            <stop offset="1" stop-color="#2d3a6e"/>

            <stop offset="0" stop-color="#4a2516"/>

        </defs>

        <path d="M236 90 C246 110 238 130 246 152 M232 170 C240 186 236 200 246 210" stroke="#6b3a24" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>

        <!-- his legs + shoes -->
        <path d="M104 212 L164 212 L160 276 L142 276 L134 232 L126 276 L108 276Z" fill="#161c3a"/>
        <path d="M100 280 C100 272 118 270 126 276 L128 282 L100 282Z" fill="#0b0b0f"/>
        <path d="M140 280 C140 272 160 270 168 278 L168 283 L140 283Z" fill="#0b0b0f"/>

        <!-- her legs: one on tiptoe, one kicked back -->
        <path d="M192 250 L189 280" stroke="#f2c3a0" stroke-width="10" stroke-linecap="round"/>
        <path d="M181 286 C182 279 192 277 197 281 L198 288 L182 288Z" fill="#b3123f"/>
        <path d="M196 288 L198 296" stroke="#b3123f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M205 250 C210 262 214 268 216 270 C226 266 234 258 238 248" stroke="#f2c3a0" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M234 240 C242 240 248 246 246 252 L238 256 Z" fill="#b3123f"/>

        <!-- necks -->
        <rect x="118" y="118" width="22" height="30" rx="8" fill="#e2ad86"/>
        <rect x="188" y="124" width="14" height="26" rx="6" fill="#f2c3a0"/>

        <!-- his tux -->
        <path d="M98 160 C100 144 120 140 128 140 C142 140 160 144 162 160 L168 216 L96 216Z" fill="url(#suit)"/>
        <path d="M120 142 L138 142 L135 186 L129 194 L123 186Z" fill="#f7f3ec"/>
        <path d="M120 142 L129 192 L108 162Z" fill="#11162e"/>
        <path d="M138 142 L129 192 L152 162Z" fill="#11162e"/>
        <path d="M121 150 L129 155 L121 160Z M137 150 L129 155 L137 160Z" fill="#b3123f"/>
        <circle cx="129" cy="155" r="2.6" fill="#7d0b2c"/>
        <circle cx="129" cy="172" r="1.6" fill="#11162e"/>
        <circle cx="129" cy="181" r="1.6" fill="#11162e"/>
        <path d="M144 176 L154 174 L153 178 Z" fill="#f5c66b"/>

        <!-- her shoulders + bodycon dress -->
        <path d="M176 166 C176 150 186 144 195 144 C206 144 216 150 216 166Z" fill="#f2c3a0"/>
        <path d="M178 162 C186 155 192 163 196 158 C200 163 206 155 214 162 C216 174 210 186 207 196 C213 206 218 216 214 228 L209 254 L184 254 L180 228 C176 216 182 206 186 196 C182 186 175 174 178 162Z" fill="url(#dress)"/>
        <path d="M209 200 C214 210 215 220 211 232" stroke="#ff7aa0" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
        <path d="M186 196 C193 199 201 199 207 196" stroke="#8f0a33" stroke-width="1.6" fill="none"/>
        <!-- her far arm holding a rose -->
        <path d="M214 160 C222 176 222 192 218 206" stroke="#f2c3a0" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M218 208 L226 236" stroke="#2f7a3a" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M222 220 C228 216 232 220 230 224 C226 226 223 224 222 220Z" fill="#2f7a3a"/>
        <circle cx="217" cy="206" r="7" fill="#c8103f"/>
        <path d="M213 205 C216 201 221 203 220 207 C218 210 214 209 215 206" stroke="#7d0b2c" stroke-width="1.4" fill="none"/>

        <!-- his arm around her waist -->
        <path d="M154 156 C166 178 184 194 206 196" stroke="url(#suit)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M199 192 L203 200" stroke="#f7f3ec" stroke-width="4"/>
        <ellipse cx="209" cy="196" rx="7.5" ry="6.5" fill="#e2ad86"/>

        <!-- her arm around his neck -->
        <path d="M184 158 C168 152 146 144 120 142" stroke="#f2c3a0" stroke-width="9" fill="none" stroke-linecap="round"/>
        <ellipse cx="117" cy="141" rx="7" ry="6" fill="#f2c3a0"/>
        <circle cx="160" cy="149" r="3" fill="#f5c66b"/>

        <!-- HIS HEAD -->
        <ellipse cx="99" cy="98" rx="8" ry="11" fill="#d99c74"/>
        <path d="M96 78 C98 56 126 46 148 58 C156 64 158 74 158 84 C162 90 168 95 167 99 C166 102 162 102 160 103 C164 106 164 110 161 111 C164 114 162 118 157 118 C156 126 148 132 136 132 C120 132 104 124 98 110 C92 100 92 88 96 78Z" fill="#e8b58f"/>
        <path d="M150 118 C146 124 140 126 134 126" stroke="#c98e68" stroke-width="1.5" fill="none" opacity=".6"/>
        <path d="M90 96 C82 64 102 34 134 36 C152 36 166 46 166 62 C158 58 150 60 146 66 C138 60 124 62 114 70 C108 76 106 86 106 96 C102 92 96 92 90 96Z" fill="#1b120d"/>
        <path d="M120 44 C134 38 150 42 158 52" stroke="#3a2a20" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M137 78 Q146 73 155 78" stroke="#1b120d" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M139 89 Q146 95 153 89" stroke="#1b120d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="142" cy="106" rx="7" ry="4" fill="#f08a8a" opacity=".5"/>

        <!-- HER HEAD -->
        <path d="M226 82 C224 60 196 50 174 62 C166 68 164 78 164 88 C161 94 157 99 158 103 C159 106 161 106 163 107 C159 110 159 114 162 115 C159 118 161 122 165 122 C166 130 174 136 186 136 C202 136 218 128 224 114 C230 104 230 92 226 82Z" fill="#f2c3a0"/>
        <path d="M163 107 C159 110 159 114 162 115 C159 118 161 122 165 122 C167 117 166 110 163 107Z" fill="#d1104a"/>
        <path d="M166 70 C168 46 204 36 228 54 C238 64 238 84 230 98 C226 84 214 72 198 70 C186 70 176 72 170 78 C168 76 167 73 166 70Z" fill="url(#hairG)"/>
        <path d="M184 52 C200 46 216 50 226 60" stroke="#6b3a24" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="222" cy="66" r="5" fill="#ff7aa0"/><circle cx="222" cy="66" r="2" fill="#f5c66b"/>
        <path d="M169 84 Q176 80 184 83" stroke="#2a130b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M169 93 Q176 99 184 93" stroke="#2a130b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M170 95 L166 99 M174 97 L171 101 M178 97 L177 102" stroke="#2a130b" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="182" cy="108" rx="7" ry="4" fill="#ff7a8a" opacity=".55"/>
        <path d="M212 114 L212 122" stroke="#f5c66b" stroke-width="1.4"/>
        <circle cx="212" cy="125" r="3.2" fill="#f5c66b"/>

        <!-- floating hearts -->
        <g class="float-heart"><path d="M162 40 C162 32 152 28 148 34 C144 40 152 46 162 54 C172 46 180 40 176 34 C172 28 162 32 162 40Z" fill="#ff4a85"/></g>
        <g class="float-heart" style="animation-delay:.7s"><path d="M140 26 C140 22 135 20 133 23 C131 26 135 29 140 33 C145 29 149 26 147 23 C145 20 140 22 140 26Z" fill="#ff8fb1"/></g>
        <g class="float-heart" style="animation-delay:1.4s"><path d="M186 22 C186 18 181 16 179 19 C177 22 181 25 186 29 C191 25 195 22 193 19 C191 16 186 18 186 22Z" fill="#ff8fb1"/></g>
      </svg>
      <h1>Yaaay!!! 💖</h1>
      <p>It's a date, Khushi 🌙<br>Candles, dinner &amp; you — can't wait! 🕯️🍷</p>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || 'Khushi';
  document.getElementById('question').textContent =
    `${name}, will you go on a romantic dinner date with me?`;

  // stars
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = 1.5 + Math.random() * 3 + 's';
    s.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(s);
  }

  const lines = [
    ["🥺", `No ${name}, pls think again… 🥺`],
    ["😢", `${name} pls… doesn't it hurt? 💔`],
    ["😭", `It hurts me ${name}… it really hurts 😭`],
    ["🕯️", `The candles are already lit for you ${name}… 🕯️`],
    ["💔", `My heart is breaking, ${name} 💔`],
    ["🌹", `Roses, moonlight & your favourite dessert. Pls ${name}? 🌹`],
    ["😌", `Okay fine… now you only have one option ${name} 😌`],
  ];

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const sub = document.getElementById('sub');
  const emoji = document.getElementById('emoji');
  const card = document.getElementById('card');
  let count = 0;

  no.addEventListener('click', () => {
    const [e, msg] = lines[Math.min(count, lines.length - 1)];
    emoji.textContent = e;
    sub.textContent = msg;
    sub.classList.remove('pop'); void sub.offsetWidth; sub.classList.add('pop');
    card.classList.remove('sad'); void card.offsetWidth; card.classList.add('sad');
    rain(['💧', '💧', '💔'], 14, 4000);
    count++;

    yes.style.fontSize = 20 + count * 9 + 'px';
    yes.style.padding = `${12 + count * 4}px ${34 + count * 10}px`;
    no.style.transform = `scale(${Math.max(1 - count * 0.13, 0.3)})`;

    if (count >= lines.length) no.classList.add('gone');
  });

  yes.addEventListener('click', () => {
    card.classList.remove('sad');
    card.classList.add('done');
    let n = 0;
    const timer = setInterval(() => {
      rain(['💖', '🌹', '✨', '❤️', '💕'], 1, 6500);
      if (++n > 120) clearInterval(timer);
    }, 70);
  });

  function rain(icons, count, life) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fall';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = 18 + Math.random() * 22 + 'px';
      el.style.animationDuration = 2 + Math.random() * 3 + 's';
      el.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), life);
    }
  }
</script>
</body>
</html>
