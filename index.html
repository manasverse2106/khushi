<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Under Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #0b0f2b;
    --sky2: #2a1446;
    --card: #1a1235cc;
    --text: #fbe9f0;
    --gold: #f5c66b;
    --yes: #e8336f;
    --yes-hover: #ff4a85;
    --no: #3a2f57;
    --no-text: #cbb9dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 120%, #4a1d4f 0%, transparent 60%),
                linear-gradient(180deg, var(--sky1), var(--sky2));
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* night sky */
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .15; } }
  .moon {
    position: fixed; top: 6vh; right: 8vw;
    width: 70px; height: 70px; border-radius: 50%;
    background: #fff4d6;
    box-shadow: 0 0 40px 10px #fff4d655;
  }
  .moon::after {
    content: ''; position: absolute; top: -6px; left: -14px;
    width: 70px; height: 70px; border-radius: 50%;
    background: var(--sky1);
  }

  .card {
    position: relative; z-index: 2;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid #f5c66b44;
    border-radius: 28px;
    padding: 34px 24px 38px;
    width: 100%; max-width: 440px;
    text-align: center;
    box-shadow: 0 0 60px #e8336f33;
  }
  .emoji {
    font-size: 84px; line-height: 1;
    display: inline-block;
    animation: glow 2.4s ease-in-out infinite;
    user-select: none;
  }
  @keyframes glow { 50% { transform: translateY(-8px); filter: drop-shadow(0 0 14px #f5c66b); } }
  h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400; color: var(--gold);
    font-size: clamp(34px, 9vw, 46px); line-height: 1.15;
    margin: 16px 0 8px;
  }
  .sub {
    min-height: 1.6em;
    font-size: 17px; font-weight: 700;
    margin-bottom: 26px;
  }
  .sub.pop { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.12); } }

  .sad #question { display: none; }
  .sad .sub {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    color: var(--gold);
    font-size: clamp(32px, 8.5vw, 42px); line-height: 1.2;
    margin: 18px 0 28px;
  }
  .sad .emoji { animation: shake .5s ease; font-size: 100px; }
  @keyframes shake {
    20%, 60% { transform: translateX(-10px) rotate(-6deg); }
    40%, 80% { transform: translateX(10px) rotate(6deg); }
  }

  .buttons {
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: center;
    min-height: 70px;
  }
  button {
    font-family: inherit; font-weight: 700;
    border: none; border-radius: 999px; cursor: pointer;
    transition: transform .25s ease, font-size .25s ease, padding .25s ease, opacity .3s;
  }
  #yes {
    background: var(--yes); color: #fff;
    font-size: 20px; padding: 12px 34px;
    box-shadow: 0 0 24px #e8336f88;
  }
  #yes:hover { background: var(--yes-hover); }
  #no { background: var(--no); color: var(--no-text); font-size: 20px; padding: 12px 34px; }
  #no.gone { opacity: 0; pointer-events: none; position: absolute; }

  /* success */
  .success { display: none; }
  .done .ask { display: none; }
  .done .success { display: block; }
  .couple { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; border-radius: 22px; box-shadow: 0 10px 40px #e8336f44; }
  .couple .float-heart { animation: rise 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  @keyframes rise { 0% { transform: translateY(8px) scale(.8); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-18px) scale(1.1); opacity: 0; } }
  .success h1 { margin-top: 6px; }
  .success p { font-size: 17px; line-height: 1.5; }

  .fall {
    position: fixed; top: -40px; z-index: 1;
    pointer-events: none; user-select: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
  <div class="moon"></div>

  <div class="card" id="card">
    <div class="ask">
      <div class="emoji" id="emoji">🕯️🍷</div>
      <h1 id="question">Khushi, will you go on a romantic dinner date with me?</h1>
      <div class="sub" id="sub">Just you, me, candles &amp; the moon 🌙</div>
      <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>

          <path d="M124 268 L148 302 L136 350 L98 292Z M172 266 L152 302 L166 330 L194 288Z" fill="#17112b"/>
          <path d="M132 266 L150 298 L168 266Z" fill="#efe1f3"/>
          <path d="M138 276 L150 282 L138 288Z M162 276 L150 282 L162 288Z" fill="#17112b"/>
          <circle cx="150" cy="282" r="3" fill="#2b2148"/>

          <!-- HER shoulders + sleeveless bodycon -->
          <path d="M234 266 C218 274 212 296 210 326 L208 410 L352 410 L346 326 C340 292 306 272 270 268Z" fill="#c07a92"/>
          <path d="M218 330 C236 312 258 312 274 324 C292 312 318 312 336 328 L344 410 L212 410Z" fill="url(#dressG)"/>
          <path d="M226 344 C232 370 230 390 236 410" stroke="#5a3a7a" stroke-width="2" fill="none" opacity=".7"/>

          <!-- HIS head -->
          <path d="M182 108 C186 122 188 132 188 140 C190 146 192 152 196 160 C200 166 202 170 199 172 C196 174 193 175 191 176 C193 178 195 181 194 183 C192 185 190 186 190 187 C193 189 194 192 192 195 C190 200 190 206 186 212 C176 222 162 226 150 226 C134 222 120 204 118 180 C116 150 122 120 140 106 C154 96 170 98 182 108Z" fill="#a9637d"/>
          <path d="M140 146 C143 162 147 172 156 178 C166 182 176 178 186 176 C190 176 193 177 194 179 L190 186 L193 191 C195 196 194 204 188 212 C178 224 160 230 146 228 C134 224 126 210 126 196 C126 178 132 160 140 146Z" fill="#1d1838"/>
          <path d="M190 180 C193 180 195 182 194 184 L189 185Z" fill="#7d3a5c"/>
          <path d="M189 188 C193 188 194 191 192 194 C190 193 189 190 189 188Z" fill="#c25a83"/>
          <ellipse cx="134" cy="156" rx="8" ry="12" fill="#8d4f6c"/><path d="M131 150 C136 152 136 160 132 162" stroke="#6e3a55" stroke-width="2" fill="none"/>
          <path d="M116 152 C102 112 124 78 164 78 C186 78 200 90 198 104 C192 100 186 104 184 110 C172 102 156 106 148 116 C142 124 140 136 140 146 C132 146 124 148 116 152Z" fill="#1d1838"/>
          <path d="M136 92 C152 82 174 82 190 92" stroke="#3b3166" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M168 131 Q177 126 186 131" stroke="#1d1838" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M171 142 Q178 146 185 142" stroke="#1d1838" stroke-width="2.6" fill="none" stroke-linecap="round"/>

          <!-- HER head -->
          <path d="M222 112 C218 124 216 134 217 142 C215 150 212 158 209 166 C207 170 208 173 211 174 C214 175 216 176 217 177 C214 179 212 182 213 184 C215 186 216 186 216 187 C213 189 212 193 215 195 C217 202 218 208 224 214 C234 222 248 224 258 220 C280 200 286 160 276 130 C266 108 244 102 222 112Z" fill="#c07a92"/>
          <path d="M217 177 C214 179 212 182 213 184 L218 185Z" fill="#e04f86"/>
          <path d="M216 187 C213 189 212 193 215 195 C219 193 219 189 216 187Z" fill="#e04f86"/>
          <path d="M216 120 C222 92 262 84 288 106 C296 116 296 132 290 150 C284 140 276 128 262 118 C250 112 236 116 226 134 C222 128 219 124 216 120Z" fill="#231a40"/>
          <path d="M276 128 C288 150 284 172 276 190 C268 210 270 224 262 236 C258 222 262 206 262 190 C262 170 268 150 270 134Z" fill="#231a40"/>
          <path d="M236 98 C252 92 270 96 282 106" stroke="#4b3a78" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M224 134 Q231 131 238 134" stroke="#231a40" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path d="M224 145 Q230 149 237 145" stroke="#231a40" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M225 147 L221 150 M228 148 L225 152 M232 148 L230 152" stroke="#231a40" stroke-width="1.5" stroke-linecap="round"/>
          <ellipse cx="236" cy="168" rx="8" ry="4.5" fill="#e88aa8" opacity=".5"/>
          <path d="M258 204 L258 214" stroke="#f5c66b" stroke-width="1.5"/>
          <use href="#h" transform="translate(258 214) scale(.38)" fill="#f5c66b"/>

          <!-- arms + hands -->
          <path d="M96 410 C116 376 146 350 172 336 L184 352 C160 366 140 386 130 410Z" fill="#1a1430"/>
          <path d="M170 334 L182 352" stroke="#efe1f3" stroke-width="5"/>
          <ellipse cx="183" cy="334" rx="12" ry="10" fill="#a9637d"/>
          <path d="M340 410 C310 384 278 360 250 342 L240 354 C262 372 286 394 300 410Z" fill="#c07a92"/>

          <ellipse cx="240" cy="334" rx="11" ry="9.5" fill="#c07a92"/>

          <!-- clinking glasses -->
          <g transform="translate(193 268) rotate(10)">
            <path d="M-18 0 C-18 30 -10 44 0 44 C10 44 18 30 18 0Z" fill="#ffffff22" stroke="#f6dcff" stroke-width="2"/>
            <path d="M-16.5 16 C-15 32 -8 42 0 42 C8 42 15 32 16.5 16Z" fill="#7d1a55"/>
            <path d="M-10 6 C-11 16 -9 24 -6 30" stroke="#fff" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/>
            <path d="M0 44 L0 84" stroke="#f6dcff" stroke-width="2.5"/>
            <ellipse cx="0" cy="86" rx="13" ry="3" fill="#f6dcff"/>
          </g>
          <g transform="translate(229 268) rotate(-10)">
            <path d="M-18 0 C-18 30 -10 44 0 44 C10 44 18 30 18 0Z" fill="#ffffff22" stroke="#f6dcff" stroke-width="2"/>
            <path d="M-16.5 16 C-15 32 -8 42 0 42 C8 42 15 32 16.5 16Z" fill="#7d1a55"/>
            <path d="M10 6 C11 16 9 24 6 30" stroke="#fff" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/>

          <g class="float-heart" fill="#ff4a85"><use href="#h" transform="translate(205 92) scale(.8)"/></g>
          <g class="float-heart" style="animation-delay:.8s" fill="#ff8fb1"><use href="#h" transform="translate(196 70) scale(.5)"/></g>

      </svg>
      <h1>Yaaay!!! 💖</h1>
      <p>It's a date, Khushi 🌙<br>Candles, dinner &amp; you — can't wait! 🕯️🍷</p>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || 'Khushi';
  document.getElementById('question').textContent =
    `${name}, will you go on a romantic dinner date with me?`;

  // stars
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = 1.5 + Math.random() * 3 + 's';
    s.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(s);
  }

  const lines = [
    ["🥺", `No ${name}, pls think again… 🥺`],
    ["😢", `${name} pls… doesn't it hurt? 💔`],
    ["😭", `It hurts me ${name}… it really hurts 😭`],
    ["🕯️", `The candles are already lit for you ${name}… 🕯️`],
    ["💔", `My heart is breaking, ${name} 💔`],
    ["🌹", `Roses, moonlight & your favourite dessert. Pls ${name}? 🌹`],
    ["😌", `Okay fine… now you only have one option ${name} 😌`],
  ];

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const sub = document.getElementById('sub');
  const emoji = document.getElementById('emoji');
  const card = document.getElementById('card');
  let count = 0;

  no.addEventListener('click', () => {
    const [e, msg] = lines[Math.min(count, lines.length - 1)];
    emoji.textContent = e;
    sub.textContent = msg;
    sub.classList.remove('pop'); void sub.offsetWidth; sub.classList.add('pop');
    card.classList.remove('sad'); void card.offsetWidth; card.classList.add('sad');
    rain(['💧', '💧', '💔'], 14, 4000);
    count++;

    yes.style.fontSize = 20 + count * 9 + 'px';
    yes.style.padding = `${12 + count * 4}px ${34 + count * 10}px`;
    no.style.transform = `scale(${Math.max(1 - count * 0.13, 0.3)})`;

    if (count >= lines.length) no.classList.add('gone');
  });

  yes.addEventListener('click', () => {
    card.classList.remove('sad');
    card.classList.add('done');
    let n = 0;
    const timer = setInterval(() => {
      rain(['💖', '🌹', '✨', '❤️', '💕'], 1, 6500);
      if (++n > 120) clearInterval(timer);
    }, 70);
  });

  function rain(icons, count, life) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fall';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = 18 + Math.random() * 22 + 'px';
      el.style.animationDuration = 2 + Math.random() * 3 + 's';
      el.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), life);
    }
  }
</script>
</body>
</html>
